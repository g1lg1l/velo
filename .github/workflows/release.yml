# From Ravune (03cb268), trimmed for Velo.
name: Release builds

# Builds Velo for Windows, macOS and Linux and attaches it to a GitHub release, under the names
# Velo's update check looks for (crates/velo/src/update.rs):
#   Windows: an installer (Inno Setup) and a zip
#   macOS:   Velo.app in a .dmg, and in a .tar.gz for self-updates (ad-hoc signed, not notarized)
#   Linux:   a tar.gz
# Pushing a tag v* starts it: the release is made as a draft (or one already there, with its
# notes, is used), the builds are attached, and once all three are in it's published. A build
# that fails leaves the draft unpublished. By hand: gh workflow run "Release builds" -f tag=vX.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (it must exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      # "v0.9.1-beta" is "Velo 0.9.1 beta", its notes the commits since the last release
      - run: |
          version="${TAG#v}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes --title "Velo ${version//-/ }"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio headers (cpal's ALSA backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # VELO_RELEASE: this build may update itself from the release's files
      - run: cargo build --release -p velo -p velo-mcp
        env:
          VELO_RELEASE: "1"
      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Windows installer and zip
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DVersion=$VERSION" installer/velo.iss
          dir="velo-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/velo.exe target/release/velo-mcp.exe README.md LICENSE-GPL LICENSE-MIT LICENSE-APACHE "$dir/"
          7z a "dist/$dir.zip" "$dir" > /dev/null

      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "$VERSION" ${{ matrix.name }}

      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          dir="velo-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir" dist
          cp target/release/velo target/release/velo-mcp README.md LICENSE-GPL LICENSE-MIT LICENSE-APACHE "$dir/"
          cp assets/icons/png/velo-256.png "$dir/velo.png"
          tar -czf "dist/$dir.tar.gz" "$dir"

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false
